name: CI Checks

on:
  pull_request:
    branches: [main]
    # No `edited`: a title/body/base tweak has nothing for this suite to re-run,
    # and a run that skips all of its jobs would still publish a "skipped"
    # conclusion over the real one for every required check. Title validation
    # lives in pr-title.yml, which is the workflow that does want `edited`.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, autonoma-2vcpu]
    timeout-minutes: 15
    outputs:
      db: ${{ steps.filter.outputs.db }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # This workflow file is in both filters on purpose. A change to ci.yml can
            # break either job - both were migrated to self-hosted runners without
            # ever running here, because the narrow filters meant a workflow-only
            # change skipped them. A job you cannot exercise from a PR that edits it
            # is a job that breaks on someone else's unrelated commit.
            db:
              - 'packages/db/prisma/**'
              - '.github/workflows/ci.yml'
            k8s:
              - 'packages/k8s/**'
              - '.github/workflows/ci.yml'

  check-migrations:
    name: Check Prisma Migrations
    runs-on: [self-hosted, autonoma-2vcpu]
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.db == 'true'
    services:
      shadow-db:
        image: postgres:18
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for pending migrations
        env:
          DATABASE_URL: "postgresql://prisma:prisma@localhost:5432/shadow"
        run: |
          SHADOW_URL="postgresql://prisma:prisma@localhost:5432/shadow"
          cat > packages/db/prisma.config.ts <<EOF
          import { defineConfig } from "prisma/config";
          export default defineConfig({
            schema: "prisma/schema.prisma",
            migrations: { path: "prisma/migrations" },
            datasource: { url: "${SHADOW_URL}", shadowDatabaseUrl: "${SHADOW_URL}" },
          });
          EOF
          diff_output=$(pnpm -F @autonoma/db db migrate diff --from-migrations ./prisma/migrations --to-schema ./prisma/schema.prisma --exit-code 2>&1) || exit_code=$?
          if [ "${exit_code:-0}" -eq 2 ]; then
            echo "::error::Prisma schema has changes not covered by a migration. Run 'pnpm db:migrate' to create one."
            echo "$diff_output"
            exit 1
          fi

  k8s-integration:
    name: K8s Integration (kind)
    runs-on: [self-hosted, autonoma-4vcpu]
    timeout-minutes: 30
    needs: changes
    # Real kind cluster; only worth spinning up when @autonoma/k8s itself changes.
    if: needs.changes.outputs.k8s == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite creates and tears down its own kind cluster, so we only need
      # the kind + kubectl binaries present (Docker is already on the runner).

      - name: Integration test
        run: TESTING=true pnpm --filter @autonoma/k8s test:integration

  lint:
    name: Lint
    runs-on: [self-hosted, autonoma-4vcpu]
    timeout-minutes: 20
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Per-job key (jobs run in parallel and must not clobber each other's
      # cache entry); the sha suffix makes each commit save a fresh immutable
      # entry, and the prefix restore-keys pulls the newest prior one so a PR's
      # later commits only recompute the packages that actually changed.
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Lint
        run: pnpm turbo run lint --continue

  test:
    name: Test
    runs-on: [self-hosted, autonoma-8vcpu]
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @autonoma/engine-web exec playwright install chromium

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Test
        # No API keys here on purpose: `pnpm test` runs only deterministic, key-free unit tests. The
        # live-model tests (real, paid, non-deterministic calls) are excluded from every package's
        # default `test` script and run on demand via `pnpm eval`.
        #
        # Concurrency capped to the runner's actual vCPU count: turbo's default (10) oversubscribes
        # the box once every package runs together, and CPU-starved event-loop scheduling was
        # blowing packages/ai's agent-loop test past its own 30s timeout (no artificial delay in that
        # test - just 1000 mock-model iterations that should finish in milliseconds when not starved).
        run: pnpm turbo run test --continue --concurrency=8

  integration-tests:
    name: Integration tests
    runs-on: [self-hosted, autonoma-4vcpu]
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No turbo cache step: test:integration is `"cache": false` in turbo.json, so there is
      # nothing to restore and a green run never lets a later commit skip the suite.
      #
      # Docker is already on the runner; each suite brings its own containers up and down.
      # @autonoma/k8s is excluded because it needs a kind cluster and has its own job above.
      #
      # One PACKAGE at a time (`--concurrency=1`), because they contend for Docker. Within a
      # package, test files now run in parallel wherever each suite owns its own database - so this
      # job's wall-clock is bounded by the runner's vCPUs rather than by the file count.
      - name: Integration test
        run: pnpm turbo run test:integration --continue --concurrency=1 --filter='!@autonoma/k8s'

  build:
    name: Build
    runs-on: [self-hosted, autonoma-8vcpu]
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Build
        run: pnpm turbo run build --filter "./apps/*" --filter "./apps/jobs/*" --filter "./apps/workers/*"

  typecheck:
    name: Typecheck
    runs-on: [self-hosted, autonoma-8vcpu]
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Typecheck
        run: pnpm turbo run typecheck --continue
