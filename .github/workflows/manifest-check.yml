name: Manifest Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "deployment/**"
      - ".github/scripts/check-manifests.sh"
      - ".github/workflows/manifest-check.yml"

concurrency:
  group: manifest-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  dry-run:
    name: Dry-run manifests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The script diffs the PR against its merge base, which needs more
          # than the default single-commit checkout.
          fetch-depth: 0

      # The production API server is not reachable from the public internet;
      # this is the same path deploy-services.yml uses to reach it.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_SERVICE_ACCOUNT_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SERVICE_ACCOUNT_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Dry-run changed manifests
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: .github/scripts/check-manifests.sh
